<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual"
      ;(function () {
        var path = location.pathname
        var isHome = path === "/" || path === "/index.html" || path === ""
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0]
        if (isHome && nav && nav.type === "reload" && location.hash) {
          history.replaceState(null, "", path + location.search)
        }
        window.scrollTo(0, 0)
      })()
    </script>
    <meta
      name="description"
      content="Bhoomi helps you find clear-title farmland, orchards, and farmhouse land, then stays with you after the purchase."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <title>Bhoomi — Find land. Unlock value.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
